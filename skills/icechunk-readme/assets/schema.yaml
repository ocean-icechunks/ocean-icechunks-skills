# Field schema for collection and product README source files.
#
# A source file is Markdown with YAML front matter. Structured fields go in the
# front matter; prose goes in the body under fixed headings (see `body:` below).
#
# Each field says:
#   required  true | false | "if <condition>"
#   source    person   written in the source file
#             auto     filled by the render script from the store or the bucket;
#                      never written by hand, so it cannot drift from the store
#             inherit  taken from the collection source file unless the product sets it
#   used_in   where the value appears: README, documentation (docs/documentation.md),
#             metadata (docs/metadata.md), collection (the collection README's tables)
#
# Status: Experimental. Built from the PacIOOS collection and its roms_hiig product
# (2026-11-21); other products may need more fields. Anything that does not fit goes in
# `extra_sections` rather than a one-off edit to a rendered README.

version: 1

collection:
  front_matter:
    level:            {required: true,  source: person, value: collection}
    title:            {required: true,  source: person, used_in: [README], description: "Collection title, e.g. 'PacIOOS Hawaiʻi ocean, wave and weather models'."}
    source_coop:      {required: true,  source: person, used_in: [README, documentation],
                       description: "Account and product on Source Cooperative; every public URL is derived from these.",
                       fields: {account: "e.g. ocean-icechunks", product: "e.g. pacioos"}}
    repository:       {required: true,  source: person, used_in: [README, documentation], description: "GitHub repository holding the build code, notes and audit."}
    provider:         {required: true,  source: person, used_in: [README, documentation],
                       description: "Who owns the source data.",
                       fields: {name: "short name, e.g. PacIOOS", long_name: "full name", url: "home page",
                                data_services_url: "provider's own data access page (header link)",
                                data_services_label: "header link text, e.g. 'Data access (PacIOOS)'"}}
    viewer:           {required: false, source: person, used_in: [README, documentation],
                       description: "The one browser viewer for the collection.",
                       fields: {name: "link text, e.g. Gridlook", url: "viewer index.html",
                                project_url: "viewer project, for credits", fork_url: "fork the published copy is built from, if any"}}
    products:         {required: true,  source: person, used_in: [README],
                       description: "Product ids in table order. Each needs a product source file; its row is built from that file, so nothing is written twice."}
    code_license:     {required: true,  source: person, used_in: [README],
                       fields: {spdx: "e.g. Apache-2.0", author: "e.g. E. E. Holmes", attribution_required: "true | false"}}
    credits:          {required: true,  source: person, used_in: [README],
                       description: "List of {label, text} pairs, e.g. Data, Icechunk packaging, Viewer. Markdown allowed in text."}
    netcdf_layout:    {required: false, source: person, used_in: [documentation],
                       description: "URL pattern of the NetCDF copies, e.g. <dataset>/netcdf/[<version>/]<year>/<file>.nc"}
  body:
    "# README":
      "## Summary":        {required: true,  description: "One or two sentences: what the data are and who makes them. The README shows only this."}
      "## Citation":       {required: true,  description: "How to cite the data. Products inherit it."}
      "## Caveats":        {required: false, description: "Known gaps a reader must see before using the data."}
    "# Documentation":     {required: true,  description: "Free sections in order, rendered to docs/documentation.md. Recommended headings: About the data; The Icechunk stores; The viewer; NetCDF copies; Known problems in the files; How this was built."}
  auto:
    product_dates:    {from: "each store's time coordinate, first and last value", used_in: [README]}
    product_netcdf:   {from: "anonymous listing of each product's netcdf/ prefix: file count and total size", used_in: [README]}
    as_of:            {from: "render date and each store's last snapshot time", used_in: [documentation]}

product:
  front_matter:
    level:            {required: true,  source: person, value: product}
    id:               {required: true,  source: person, description: "Folder name under the collection, e.g. roms_hiig. Usually the provider's dataset id."}
    collection:       {required: true,  source: person, description: "Relative path to the collection source file, for inherited fields."}
    title:            {required: true,  source: person, used_in: [README, documentation, metadata]}
    row:              {required: true,  source: person, used_in: [collection],
                       description: "This product's row in the collection tables.",
                       fields: {name: "e.g. ROMS ocean forecast", detail: "e.g. daily runs; 3-hourly, ~4 km, 36 depths",
                                short_name: "e.g. ROMS forecast, best time series", store_note: "e.g. best time series"}}
    store_url:        {required: true,  source: person, used_in: [README], description: "Public HTTPS URL of the Icechunk store."}
    netcdf_url:       {required: false, source: person, used_in: [documentation], description: "Public prefix of the NetCDF copies the store references."}
    provider_page:    {required: false, source: person, used_in: [README], fields: {label: "e.g. PacIOOS dataset page", url: ""}}
    viewer:           {required: "if the collection has a viewer", source: person, used_in: [README, documentation, collection],
                       description: "Opening view; the link is built from the collection viewer URL, store_url and these.",
                       fields: {variable: "variable shown first, e.g. temp", view: "viewer state after varname, e.g. px=0::py=0::alt=4000000::lat=20.5::lon=-158.2::dimIndices_time=0::dimIndices_depth=0",
                                fields: "optional list of {label, variable, view} for the per-variable table in documentation"}}
    groups_note:      {required: "if the store has more than one group", source: person, used_in: [README],
                       description: "Why the store is split into groups, so nobody 'fixes' the split."}
    coordinate_notes: {required: false, source: person, used_in: [README],
                       description: "Map of coordinate name to a plain-language Values cell, replacing the auto range, e.g. time: '2025-01-01T00Z to 7 days after the newest run, every 3 hours'."}
    variable_notes:   {required: false, source: person, used_in: [README],
                       description: "Map of variable name to text for the Standard name cell when it has none, e.g. mask."}
    code:             {required: true,  source: person, used_in: [README],
                       description: "One entry per language, in link order; the collection's Code column lists them ('Python, R'). Python is the only language with a built-in snippet.",
                       fields: {python: {python_version: "minimum, e.g. 3.12 (rendered 'Python 3.12 or newer')",
                                         packages: "list with minimum versions, e.g. [icechunk >= 2.3, xarray, zarr]",
                                         pip: 'e.g. pip install "icechunk>=2.3" xarray zarr',
                                         function: "loader name, e.g. open_forecast",
                                         docstring: "one line",
                                         concurrency: "zarr async.concurrency, e.g. 128",
                                         chunks_advice: "comment placed above the first call; optional"}}}
    access:           {required: false, source: person, used_in: [README],
                       description: "Only when reads are not anonymous public HTTPS: credentials needed, and any region or network limit.",
                       fields: {auth: "", region: ""}}
    performance:      {required: true,  source: person, used_in: [README],
                       description: "Measured reads; never estimated.",
                       fields: {rows: "list of {read, chunks, data_moved, time}", measured: "when, where and with which settings"}}
    provenance:       {required: true,  source: person, used_in: [README],
                       fields: {built: "date of the first build", build_script: "e.g. build_store.py", build_url: "link to it in the repository",
                                tested_with: "package versions the README code was run with, e.g. icechunk 2.3.1, xarray 2026.9.0, Python 3.12",
                                build_files: "list of file names in docs/",
                                how_made: "{file, url} of how_store_created.md", plan: "{label, url} of the planning issue"}}
    citation_extra:   {required: false, source: person, used_in: [README], description: "Added after the inherited citation, e.g. who runs the model."}
    metadata:         {required: false, source: person, used_in: [metadata],
                       fields: {netcdf_attributes: "true to add the latest NetCDF file's attributes as a second table (forecasts, patched metadata)"}}
    extra_sections:   {required: false, source: person, used_in: [README],
                       description: "Escape hatch: list of {after, heading, file or text}. Use only when no field fits, and say why in the source file."}
    provider:         {source: inherit}
    repository:       {source: inherit}
    code_license:     {source: inherit}
    source_coop:      {source: inherit}
    viewer_base:      {source: inherit, description: "collection viewer.url"}
  body:
    "# README":
      "## Summary":          {required: true,  description: "What the store is: model, region, resolution, cadence. The store URL is placed after it automatically."}
      "## Notes":            {required: false, description: "Short paragraphs a reader needs before the tables, e.g. what 'best time series' means."}
      "## Variable notes":   {required: false, description: "Short lines after the tables, e.g. 'Land reads as NaN.'"}
      "## Example analyses": {required: true,  description: "One code block per language, run against the store, each step with a comment."}
      "## Source files":     {required: true,  description: "One paragraph: what the files are, how they were copied, coverage and gaps."}
      "## Caveats":          {required: false, description: "Known gaps or anything unverified a reader must see in the README."}
    "# Documentation":       {required: true,  description: "Free sections in order, rendered to docs/documentation.md. The placeholder {{viewer_fields_table}} is replaced by the per-variable viewer table built from viewer.fields. Recommended headings: A virtual store; What the store adds over the files; The viewer; Where the metadata came from; The time axis; Opening the store: notes; Performance: why reads cost what they do; How the store was built and validated; Updates. 'A virtual store' is required."}
  auto:
    variables:        {from: "store: every data variable per group, with dims, units, standard_name (long_name if absent)", used_in: [README]}
    coordinates:      {from: "store: name, size, first to last value with units", used_in: [README]}
    groups:           {from: "store: group tree; one-group stores show no group line", used_in: [README]}
    snapshot:         {from: "store: the snapshot main points at, and its time", used_in: [README, metadata]}
    last_update:      {from: "store: time of that snapshot", used_in: [README]}
    store_attributes: {from: "store: root group attributes", used_in: [metadata]}
    netcdf_attributes: {from: "latest NetCDF copy by filename date, when metadata.netcdf_attributes is true", used_in: [metadata]}
